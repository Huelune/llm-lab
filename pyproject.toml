[project]
name = "llm-lab"
version = "0.1.0"
description = "회사 LLM 연결·기능 점검 도구와 공용 클라이언트"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "openai>=3.22,<4",
    "python-dotenv>=1.2",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "ruff>=0.16",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 임시 폴더를 프로젝트 안에 둔다 (%TEMP% 접근이 막힌 샌드박스·CI에서도 tmp_path가 동작하도록)
addopts = ["--basetemp=.pytest-tmp"]
